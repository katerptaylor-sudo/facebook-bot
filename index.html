<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            background: #f0f2f5;
            margin: 0;
        }

        h2 {
            color: #1877F2;
            font-size: 28px;
        }

        p {
            color: #333;
            font-size: 16px;
        }

        a {
            display: block;
            margin: 20px auto;
            padding: 16px;
            max-width: 300px;
            background: #1877F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        a:active {
            opacity: 0.8;
        }

        .messages {
            background: #0084FF;
        }
    </style>
</head>

<body>

    <h2>Facebook</h2>

    <p>Choose where you want to go.</p>

    <a href="https://www.facebook.com/">
        Open Facebook
    </a>

    <a href="https://m.facebook.com/messages/"
       class="messages"
       onclick="openMessages(event)">
        Open Facebook Messages
    </a>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        function openMessages(event) {
            event.preventDefault();

            var messagesURL = "https://m.facebook.com/messages/";

            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.openLink(messagesURL);
            } else {
                window.location.href = messagesURL;
            }
        }
    </script>

</body>
</html>
