<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 25px 15px;
            background: #f0f2f5;
        }

        h2 {
            color: #1877f2;
        }

        button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 15px auto;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #1877f2;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        #status {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h2>Facebook Mini App</h2>

    <button onclick="openPage('https://m.facebook.com/')">
        Open Facebook
    </button>

    <button onclick="openPage('https://m.facebook.com/messages/')">
        Open Facebook Messages
    </button>

    <p id="status">
        Pages will be opened within this Mini App when the website allows it.
    </p>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        function openPage(url) {
            // Navigate the current Mini App window.
            // This does not intentionally open Chrome.
            window.location.href = url;
        }
    </script>

</body>
</html>
